[project]
name = "cashew-market-intelligence"
version = "0.1.0"
description = "Excel-to-PostgreSQL buyer intelligence MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "streamlit>=1.40,<2",
  "requests>=2.32,<3",
  "python-multipart>=0.0.9,<1",
  "rapidfuzz>=3.9,<4",
  "beautifulsoup4>=4.12,<5",
  "selenium>=4.20,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
